<h1>Easy</h1>
<ul>
<li>A card can go on any card one rank higher, whatever its suit: any 7 on any 8.</li>
<li>You can undo every move, including dealing the reserve.</li>
</ul>
<p>To win, you still need each finished column in a single suit, so use the
freedom to shuffle cards around rather than to finish.</p>
