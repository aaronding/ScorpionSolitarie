<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Scorpion Solitaire: a patience game where every deal can be won." />
    <meta name="theme-color" content="#16603a" />
    <title>Scorpion Solitaire</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="notice" class="notice" role="status" hidden>
      <span class="text"></span>
      <span class="actions"></span>
    </div>
    <main id="table" class="table" aria-label="Card table"></main>
    <footer class="bar">
      <span id="info" class="info"></span>
      <nav id="tools" class="tools" aria-label="Game"></nav>
      <span id="score" class="score"></span>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
